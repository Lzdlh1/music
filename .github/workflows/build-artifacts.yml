name: Build executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name music-uploader-windows run_server.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-uploader-windows
          path: dist/music-uploader-windows.exe

  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build ARMv7 executable inside container
        run: |
          docker run --platform linux/arm/v7 --rm -v "$PWD":/work -w /work python:3.11-slim bash -lc "apt-get update && apt-get install -y build-essential wget ca-certificates gcc libssl-dev && python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller && pyinstaller --onefile --name music-uploader-armv7 run_server.py && tar -czf /work/dist-music-uploader-armv7.tar.gz -C dist ."
      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-uploader-armv7
          path: dist-music-uploader-armv7.tar.gz
