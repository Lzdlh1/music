name: github-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 (例如: v1.0.0)'
        required: true
        type: string

env:
  PROJECT_NAME: music
  DOCKER_IMAGE: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  test:
    name: ✅ Run tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧪 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: 🧪 Run tests
        run: |
          if [ -f "pytest.ini" ] || [ -d "tests" ]; then
            pytest -q
          else
            echo "No tests detected"
          fi

      - name: ✅ Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            .

  build-frontend:
    name: 🎨 Build frontend (if present)
    runs-on: ubuntu-latest
    outputs:
      frontend-exists: ${{ steps.check.outputs.frontend_exists }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Check frontend
        id: check
        run: |
          if [ -d "web" ]; then
            echo "frontend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧩 Setup Node (pnpm)
        if: steps.check.outputs.frontend_exists == 'true' && (exists('web/package.json') == 'true' || exists('web/pnpm-lock.yaml') == 'true')
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: true
          package_json_path: web/package.json

      - name: 🎨 Build web
        if: steps.check.outputs.frontend_exists == 'true'
        run: |
          if [ -f "web/package.json" ]; then
            cd web
            pnpm build || npm run build || echo "no build script"
            cd -
          else
            echo "No package.json inside web, archiving web/"
          fi

      - name: 📤 Upload frontend artifact
        if: steps.check.outputs.frontend_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            web/dist/
            web/
          retention-days: 1
          compression-level: 6

  build-docker:
    name: 🐳 Build Docker images (multi-arch)
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    strategy:
      matrix:
        include:
          - suffix: linux-amd64
            platform: linux/amd64
          - suffix: linux-arm64
            platform: linux/arm64
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: 📦 Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠 Build image (no push)
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}

      - name: 🗂 Save image to tar
        run: |
          image_tag=${{ env.DOCKER_IMAGE }}:${GITHUB_REF#refs/tags/}-${{ matrix.suffix }}
          # fallback if github.ref_name not set
          TAG=${{ github.ref_name }}
          if [ -z "$TAG" ]; then TAG=${{ github.event.inputs.tag }}; fi
          IMAGE=${{ env.DOCKER_IMAGE }}:${TAG}-${{ matrix.suffix }}
          docker save "$IMAGE" | gzip > ${PROJECT_NAME}-${{ matrix.suffix }}.tar.gz

      - name: 📤 Upload docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.suffix }}
          path: ${PROJECT_NAME}-${{ matrix.suffix }}.tar.gz
          retention-days: 7

  release:
    name: 📦 Create GitHub Release
    needs: [build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔊 Prepare release variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VAR_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "VAR_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "VAR_GIT_SUMMARY=$(git describe --tags --dirty --always)" >> $GITHUB_ENV

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🔧 Prepare release files
        run: |
          mkdir -p release-files
          # collect docker artifacts
          find artifacts -name "${PROJECT_NAME}-*.tar.gz" -exec cp {} release-files/ \; || true
          # collect frontend dist if present
          if [ -d "artifacts/frontend-dist" ]; then
            cp -r artifacts/frontend-dist release-files/frontend-dist || true
          fi
          cd release-files || true
          ls -la

      - name: 📋 Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "${{ env.VERSION }}"
          body: |
            ## Release ${{ env.VERSION }}

            - commit: ${{ env.VAR_COMMIT }}
            - build: ${{ env.VAR_BUILD_DATE }}

            ## Assets
            - Docker images and front-end artifacts
          files: |
            release-files/*

      - name: ✅ Done
        run: echo "Release ${{ env.VERSION }} created."