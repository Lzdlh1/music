version: "3.8"

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      - RCLONE_REMOTE=${RCLONE_REMOTE}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "12234:12233" # backend container listens on 12233, mapped to host 12234 to avoid conflict with frontend
    volumes:
      - ./backend/data:/app/data
      - ./rclone:/root/.config/rclone
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "12233:12233" # dev server exposed on host 12233
    environment:
      - VITE_API_BASE=http://localhost:12234/api # frontend (in browser) will call backend on host port 12234
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    restart: unless-stopped
