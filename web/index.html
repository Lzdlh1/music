<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Music Uploader</title>
  <style>body{font-family:system-ui,Segoe UI;max-width:900px;margin:2rem auto;padding:1rem}input,button{padding:.5rem;margin:.3rem}</style>
</head>
<body>
  <h1>Music Uploader</h1>
  <div id="auth">
    <h3>Login</h3>
    <input id="username" placeholder="username" />
    <input id="password" type="password" placeholder="password" />
    <button id="login">Login</button>
    <div id="loginMsg"></div>
  </div>

  <div id="app" style="display:none">
    <h3>Create task</h3>
    <input id="url" placeholder="Public file URL (http(s)://...)" style="width:60%" />
    <input id="title" placeholder="Optional title" />
    <button id="create">Create & Start</button>

    <h3>Tasks</h3>
    <button id="refresh">Refresh</button>
    <ul id="tasks"></ul>
  </div>

<script>
const API = (path, opts={})=>fetch('/api'+path, opts).then(r=>r.json())
let token = null

document.getElementById('login').onclick = async ()=>{
  const username = document.getElementById('username').value
  const password = document.getElementById('password').value
  const fd = new URLSearchParams(); fd.append('username', username); fd.append('password', password)
  const res = await fetch('/api/auth/login', {method:'POST', body:fd})
  if (res.ok){
    const j = await res.json(); token = j.access_token; document.getElementById('auth').style.display='none'; document.getElementById('app').style.display='block';
  } else { document.getElementById('loginMsg').innerText='Login failed' }
}

document.getElementById('create').onclick = async ()=>{
  const url = document.getElementById('url').value
  const title = document.getElementById('title').value
  const res = await fetch('/api/tasks', {method:'POST', headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}, body: JSON.stringify({url,title})})
  refreshTasks()
}

document.getElementById('refresh').onclick = refreshTasks

async function refreshTasks(){
  const res = await fetch('/api/tasks', {headers:{'Authorization':'Bearer '+token}})
  const tasks = await res.json();
  const ul = document.getElementById('tasks'); ul.innerHTML=''
  tasks.forEach(t=>{ const li = document.createElement('li'); li.innerText = `[${t.id}] ${t.title||t.url} => ${t.status} ${t.message||''}`; ul.appendChild(li) })
}
</script>
</body>
</html>
